# Supabase CLI configuration for Slaids.
#
# Deliberately minimal: it configures the one Slaids Edge Function and nothing
# else. Auth, database and storage are managed in the Supabase dashboard and by
# `scripts/deploy-migrations.sh`, and a fuller config here would let a stray
# `supabase` command push local defaults over them. Do not add auth, database or
# storage sections.

project_id = "slaids"

[functions.slaids-share]
# The whole point of this function: it is read by people who are not signed in,
# so Supabase must not demand a JWT before it runs. Access control is the share
# token in the URL, checked inside the function against `is_shared`.
verify_jwt = false
