name: Clarify image handoff

on:
  push:
    branches:
      - docs/image-handoff-file-return-clarity

permissions:
  contents: write

jobs:
  clarify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/image-handoff-file-return-clarity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clarify prompt handoff versus file return
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/agent/design.ts',
              'Hvis klienten ikke kan gjøre denne overleveringen direkte, er den samme briefen fortsatt normal leveranse til stedet rasterfilene produseres. Ikke bytt til en hjemmelaget erstatning eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.',
              'Hvis klienten ikke kan gjøre denne overleveringen direkte, er den samme briefen fortsatt normal leveranse til stedet rasterfilene produseres. Direkte overlevering av briefen automatiserer bare starten på bildegenereringen; uten en filbro tilbake til Slaids går de ferdige filene fortsatt via bildedeponeringen. Ikke bytt til en hjemmelaget erstatning eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.',
          )
          replace_once(
              'README.md',
              'direkte til innebygd bildegenerering i samme samtale. Kopiering av briefen og\nbildedeponeringen er fortsatt en gyldig filoverføringsvei når direkte overlevering\nikke finnes.',
              'direkte til innebygd bildegenerering i samme samtale. Hvis klienten ikke kan\nsende briefen direkte, kan den fortsatt kopieres manuelt. Uten en egen filbro\ntilbake til Slaids går de ferdige bildefilene fortsatt via bildedeponeringen.',
          )
          replace_once(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              'Hvis klienten ikke kan gjøre denne overleveringen direkte, brukes nøyaktig den samme briefen der bildene produseres; det er fortsatt normal arbeidsflyt, ikke en fallback.',
              'Hvis klienten ikke kan gjøre denne overleveringen direkte, brukes nøyaktig den samme briefen der bildene produseres; det er fortsatt normal arbeidsflyt, ikke en fallback. Direkte overlevering av briefen automatiserer bare starten på genereringen; uten en filbro tilbake til Slaids går de ferdige bildefilene fortsatt via bildedeponeringen nedenfor.',
          )
          replace_once(
              'IMPLEMENTATION_PLAN.md',
              'finnes, brukes den samme briefen der bildene produseres; det er ikke en fallback.\n\nPlanleggingen skjer i tre deler',
              'finnes, brukes den samme briefen der bildene produseres; det er ikke en fallback.\nDenne direkte overleveringen gjelder briefen, ikke filreturen: uten en filbro\ntilbake til Slaids går de ferdige bildefilene fortsatt gjennom bildedeponeringen\ni 7.3.\n\nPlanleggingen skjer i tre deler',
          )
          replace_once(
              'IMPLEMENTATION_PLAN.md',
              'Briefen er bestillingen. En vertsklient kan sende den direkte til bildegenerering; når filene er produsert, er deponeringen returen: brukeren legger bildene inn samlet, og hver fil havner i sonen den ble bestilt\nfor uten at noen må pare fil mot sone for hånd.',
              'Briefen er bestillingen. En vertsklient kan sende den direkte til\nbildegenerering. Når filene er produsert, er deponeringen returen: brukeren\nlegger bildene inn samlet, og hver fil havner i sonen den ble bestilt for uten at\nnoen må pare fil mot sone for hånd.',
          )
          replace_once(
              'src/server/mcp/instructions.test.ts',
              '    expect(RASTER_WORKFLOW_RULE).toMatch(/ikke en fallback eller nødløsning/i)\n    expect(surface).not.toMatch',
              '    expect(RASTER_WORKFLOW_RULE).toMatch(/ikke en fallback eller nødløsning/i)\n    expect(RASTER_WORKFLOW_RULE).toMatch(/filbro.*bildedeponeringen/i)\n    expect(surface).not.toMatch',
          )
          replace_once(
              'src/server/mcp/visualPlanningInstructions.test.ts',
              '    expect(MCP_INSTRUCTIONS).toMatch(/uten at brukeren kopierer og limer/i)\n    expect(MCP_INSTRUCTIONS).not.toMatch',
              '    expect(MCP_INSTRUCTIONS).toMatch(/uten at brukeren kopierer og limer/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/filbro.*bildedeponeringen/i)\n    expect(MCP_INSTRUCTIONS).not.toMatch',
          )
          PY
      - run: npx vitest run src/server/mcp/instructions.test.ts src/server/mcp/visualPlanningInstructions.test.ts src/domain/docs.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit clarification
        run: |
          rm -f .github/workflows/image-handoff-clarity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clarify image brief handoff and file return"
          git push origin HEAD:docs/image-handoff-file-return-clarity
