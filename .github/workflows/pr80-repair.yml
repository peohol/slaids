name: Repair PR 80

on:
  push:
    branches:
      - docs/image-brief-default-workflow

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/image-brief-default-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply raster workflow repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          def regex_once(path, pattern, repl, flags=0):
              p = Path(path)
              text = p.read_text()
              text2, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected one regex match in {path}, got {n}: {pattern}')
              p.write_text(text2)

          # Canonical design contract: no availability/fallback branch.
          replace_once(
              'src/agent/design.ts',
              "}. Mangler du en rastergenerator, skal du ikke droppe relevante bilder: planlegg dem. Lag bildesonen, legg bildet inn i dekkets bildeplan, og skriv dekkets felles bildekontekst så snart minst ett rasterbilde er planlagt – også om det bare er ett.`",
              "}. Relevante rasterbilder skal planlegges som ekte bildesoner og legges inn i dekkets bildeplan; skriv dekkets felles bildekontekst så snart minst ett rasterbilde er planlagt – også om det bare er ett.`",
          )
          replace_once(
              'src/agent/design.ts',
              "export const IMAGE_POLICY_SUMMARY =\n  'Vektor og raster er ikke samme verktøy, og SVG er aldri en alternativ slide-motor. Ikoner, grafer, plott, diagrammer, flytskjemaer, kart der vektor passer og enkle skjematiske forklaringsfigurer skal være SVG, og skal forbli SVG. Illustrasjonsbilder er normalvalget rasterbilder – mennesker, dyr, natur, bygninger, miljøer, gjenstander, historiske scener og andre motiver som først og fremst skal illustrere, ikke diagrammatisere – fra en egnet bildegenerator; har du ingen, planlegger du bildesonen og bildeplanen i stedet for å improvisere en SVG-erstatning.'",
              "export const IMAGE_POLICY_SUMMARY =\n  'Vektor og raster er ikke samme verktøy, og SVG er aldri en alternativ slide-motor. Ikoner, grafer, plott, diagrammer, flytskjemaer, kart der vektor passer og enkle skjematiske forklaringsfigurer skal være SVG, og skal forbli SVG. Illustrasjonsbilder er normalvalget rasterbilder – mennesker, dyr, natur, bygninger, miljøer, gjenstander, historiske scener og andre motiver som først og fremst skal illustrere, ikke diagrammatisere – og skal ikke erstattes av SVG bare fordi SVG kan produseres direkte.'\n\n/** The fixed raster planning and client hand-off contract. */\nexport const RASTER_WORKFLOW_RULE =\n  'Slaids-agent-API-et lager ikke rasterbilder; det er et bevisst arkitekturvalg, ikke en manglende funksjon som skal oppdages. Ikke undersøk om Slaids eller vertsklienten «har en bildegenerator» før du planlegger. Rasterflyten er alltid: reserver ekte bildesoner, skriv bildeplan og felles bildekontekst, og la Slaids generere den samlede bildebriefen. Dette er standardflyten, ikke en fallback eller nødløsning. Når vertsklienten allerede har et separat, innebygd bildegenereringsverktøy og brukeren har bedt om at bildene skal genereres, hent den ferdige briefen og send den direkte videre i samme samtale uten at brukeren kopierer og limer. Hvis klienten ikke kan gjøre denne overleveringen direkte, er den samme briefen fortsatt normal leveranse til stedet rasterfilene produseres. Ikke bytt til en hjemmelaget erstatning eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.'",
          )
          replace_once(
              'src/agent/design.ts',
              "  'Har du ingen generativ bildemodell tilgjengelig, si tydelig fra om begrensningen i stedet for å lage en dårligere erstatning og fremstille den som likeverdig – og reserver bildesonen og legg bildet inn i bildeplanen, så brukeren kan lage filen selv og sette den inn i den geometrien du planla.',",
              "  'Hvor rasterfilen senere produseres endrer ikke medievalget: et planlagt rastermotiv skal fortsatt være raster og skal ikke erstattes av en hjemmelaget SVG eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.',",
          )

          # MCP instructions import and expose the canonical rule once.
          replace_once(
              'src/server/mcp/instructions.ts',
              "  QUOTE_RULE,\n  REFERENCE_SYSTEM_RULE,",
              "  QUOTE_RULE,\n  RASTER_WORKFLOW_RULE,\n  REFERENCE_SYSTEM_RULE,",
          )
          regex_once(
              'src/server/mcp/instructions.ts',
              r"- \*\*Rasterflyten er fast, ikke en fallback\.\*\* .*?Det er en klient-side handoff, ikke bildegenerering i Slaids-API-et\.\n",
              "- **Rasterflyten er fast, ikke en fallback.** ${RASTER_WORKFLOW_RULE}\n",
          )
          regex_once(
              'src/server/mcp/instructions.ts',
              r"4\. Før du lager den første visuelle filen, gjør ett samlet visuelt pass over hele dekket\..*?ellers som leveransen brukeren kan bruke der bildene produseres\.\n",
              "4. Før du lager den første visuelle filen, gjør ett samlet visuelt pass over hele dekket. Identifiser konkrete visuelle ankerpunkter og bestem medietype for hvert av dem ut fra pedagogisk rolle: raster når publikum trenger å se personen, stedet, bygget, gjenstanden, miljøet eller scenen; SVG når publikum trenger å se relasjonen, strukturen, sekvensen, målingen eller flyten. Deretter avgjør du hvilke soner som trenger visuelt innhold. Diagrammatisk figur blir SVG og fyller bare sin egen sone. Illustrasjon blir et rasterbilde: lag bildesonen først, slik at sonens format passer motivet, legg bildet inn i dekkets bildeplan og skriv felles bildekontekst. Når planen er ferdig, hent den genererte bildebriefen.\n",
          )
          regex_once(
              'src/server/mcp/instructions.ts',
              r"- \*\*Slaids genererer ikke rasterbilder\.\*\* .*?De ferdige filene er fortsatt vanlige bildeassets som må inn i de reserverte sonene\.\n",
              "- **Rasterfiler er vanlige assets.** Selve rasterfilen produseres utenfor Slaids-agent-API-et og legges deretter i den reserverte sonen. En diagrammatisk figur skriver du selv som SVG-markup til sonen den hører hjemme i, aldri som en hel slide.\n",
          )
          regex_once(
              'src/server/mcp/instructions.ts',
              r"- \*\*Den samlede bildebriefen skriver du ikke selv\.\*\* .*?i stedet for å be brukeren kopiere den\.\n",
              "- **Den samlede bildebriefen skriver du ikke selv.** Slaids teller bildene, nummererer dem, måler aspect ratio fra hver sones geometri og setter sammen den ene teksten som brukes til bildegenereringen. Du skriver den felles bildekonteksten og motivene; alt det andre er avledet, og en aspect ratio du oppgir i fritekst er nettopp det som gjør brief og sone uenige.\n",
          )

          # Tests: replace the old availability contract with the fixed workflow contract.
          replace_once(
              'src/server/mcp/instructions.test.ts',
              "  RASTER_POLICY,\n  REFERENCE_SYSTEM_RULE,",
              "  RASTER_POLICY,\n  RASTER_WORKFLOW_RULE,\n  REFERENCE_SYSTEM_RULE,",
          )
          replace_once(
              'src/server/mcp/instructions.test.ts',
              "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,",
              "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE,",
          ) if False else None
          replace_once(
              'src/server/mcp/instructions.test.ts',
              "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,",
              "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE,",
          ) if "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE," in Path('src/server/mcp/instructions.test.ts').read_text() else None
          replace_once(
              'src/server/mcp/instructions.test.ts',
              "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE,",
              "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE,",
          ) if "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE," in Path('src/server/mcp/instructions.test.ts').read_text() else None
          text = Path('src/server/mcp/instructions.test.ts').read_text()
          if '  RASTER_WORKFLOW_RULE,\n  RASTER_WORKFLOW_RULE,' in text:
              text = text.replace('  RASTER_WORKFLOW_RULE,\n  RASTER_WORKFLOW_RULE,', '  RASTER_WORKFLOW_RULE,')
              Path('src/server/mcp/instructions.test.ts').write_text(text)
          replace_once(
              'src/server/mcp/instructions.test.ts',
              "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE,\n  REFERENCE_SYSTEM_RULE,",
              "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE,\n  REFERENCE_SYSTEM_RULE,",
          ) if "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,\n  IMAGE_PLAN_RULE,\n  REFERENCE_SYSTEM_RULE," in Path('src/server/mcp/instructions.test.ts').read_text() else None
          # Ensure canonical rule is included in NORMATIVE exactly once.
          text = Path('src/server/mcp/instructions.test.ts').read_text()
          marker = "  IMAGE_POLICY_SUMMARY,\n  IMAGE_BRIEF_RULE,"
          if marker in text and "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE," not in text:
              text = text.replace(marker, "  IMAGE_POLICY_SUMMARY,\n  RASTER_WORKFLOW_RULE,\n  IMAGE_BRIEF_RULE,", 1)
          Path('src/server/mcp/instructions.test.ts').write_text(text)
          regex_once(
              'src/server/mcp/instructions.test.ts',
              r"  it\('ber agenten si fra når den mangler en bildegenerator, i stedet for å improvisere', \(\) => \{\n    expect\(RASTER_POLICY\.join\(' '\)\)\.toMatch\(/si tydelig fra om begrensningen/i\)\n  \}\)\n\n  it\('sier at denne serveren ikke lager bilder, uten å love at det aldri skjer', \(\) => \{\n    expect\(MCP_INSTRUCTIONS\)\.toMatch\(/lager ikke bilder/i\)\n    expect\(agentSurface\(\)\)\.not\.toMatch\(/kommer ikke til å\|aldri kommer til/i\)\n  \}\)",
              "  it('gjør rasterplanen til standard i stedet for availability-fallback', () => {\n    const surface = agentSurface()\n    expect(surface).toContain(RASTER_WORKFLOW_RULE)\n    expect(RASTER_WORKFLOW_RULE).toMatch(/standardflyten/i)\n    expect(RASTER_WORKFLOW_RULE).toMatch(/ikke en fallback eller nødløsning/i)\n    expect(surface).not.toMatch(/Mangler du en rastergenerator|har du ingen[^.]*bildegenerator/i)\n    expect(RASTER_POLICY.join(' ')).not.toMatch(/si tydelig fra om begrensningen/i)\n  })\n\n  it('sier at Slaids-agent-API-et ikke lager rasterbilder, uten å love at det aldri skjer', () => {\n    expect(MCP_INSTRUCTIONS).toContain(RASTER_WORKFLOW_RULE)\n    expect(RASTER_WORKFLOW_RULE).toMatch(/lager ikke rasterbilder/i)\n    expect(agentSurface()).not.toMatch(/kommer ikke til å|aldri kommer til/i)\n  })",
          )

          # Small visual-planning test: add direct handoff regression and keep anti-SVG intent.
          replace_once(
              'src/server/mcp/visualPlanningInstructions.test.ts',
              "    expect(MCP_INSTRUCTIONS).toMatch(/ikke en hjemmelaget erstatning eller et abstrakt diagram/i)\n  })\n\n  it('forces explicit reassessment",
              "    expect(MCP_INSTRUCTIONS).toMatch(/hjemmelaget erstatning eller et abstrakt diagram/i)\n  })\n\n  it('treats raster planning as the fixed standard and hands the brief to the host generator', () => {\n    expect(MCP_INSTRUCTIONS).toMatch(/Rasterflyten er fast, ikke en fallback/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/send den direkte videre i samme samtale/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/uten at brukeren kopierer og limer/i)\n    expect(MCP_INSTRUCTIONS).not.toMatch(/Mangler du en rastergenerator|har du ingen[^.]*bildegenerator/i)\n  })\n\n  it('forces explicit reassessment",
          )

          # Reader-facing design guide.
          replace_once(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              "Manglende bildegenerator er ikke en grunn til å droppe relevante bilder. Rekkefølgen er alltid den samme, også når filene skal lages et annet sted:",
              "Rasterbilder følger én standardflyt uansett hvor filene senere produseres. Agenten skal ikke først undersøke om Slaids eller vertsklienten har en bildegenerator; planleggingen er den samme:",
          )
          replace_once(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              "Slaids gjør resten: nummererer bildene i dekkets rekkefølge, måler aspect ratio fra hver sones faktiske geometri, setter plassholder-bildeteksten i hver ufylt bildesone — «Sett inn bilde 1 her», «Sett inn bilde 2 her» og så videre — og genererer den samlede bildebriefen. Plassholderen forsvinner av seg selv når filen legges inn i sonen, så den blir aldri stående over det ferdige dekket.\n\nAgenten oppgir aldri aspect ratio i fritekst, og skriver aldri den samlede briefen selv. Det er nettopp den doble beskrivelsen som gjorde at brede prompter ble skrevet til nær kvadratiske soner.",
              "Slaids gjør resten: nummererer bildene i dekkets rekkefølge, måler aspect ratio fra hver sones faktiske geometri, setter plassholder-bildeteksten i hver ufylt bildesone — «Sett inn bilde 1 her», «Sett inn bilde 2 her» og så videre — og genererer den samlede bildebriefen. Plassholderen forsvinner av seg selv når filen legges inn i sonen, så den blir aldri stående over det ferdige dekket.\n\nNår Slaids brukes fra en vertsklient som ChatGPT og brukeren har bedt om bildegenerering, kan klienten sende denne ferdige briefen direkte til sitt innebygde bildegenereringsverktøy i samme samtale. Brukeren skal ikke måtte kopiere og lime briefen bare for å starte genereringen. Hvis klienten ikke kan gjøre denne overleveringen direkte, brukes nøyaktig den samme briefen der bildene produseres; det er fortsatt normal arbeidsflyt, ikke en fallback.\n\nAgenten oppgir aldri aspect ratio i fritekst, og skriver aldri den samlede briefen selv. Det er nettopp den doble beskrivelsen som gjorde at brede prompter ble skrevet til nær kvadratiske soner.",
          )
          replace_once(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              "2. Bildebriefen vises, med én knapp som kopierer hele briefen og en nummerert liste over bildene som skal lages: nummer, format og motiv, slik at «bilde 3» kan kontrolleres før filene lages.\n3. Brukeren lager bildene et annet sted og lagrer dem som `1`, `2`, `3` … opp til *N*, med den filendelsen de får.",
              "2. Bildebriefen vises med en nummerert liste over bildene som skal lages: nummer, format og motiv. Kopi-knappen finnes fortsatt for klienter og arbeidsflyter som trenger manuell overlevering.\n3. Bildene kan genereres direkte av vertsklienten eller produseres et annet sted. Når bildefilene er tilgjengelige, lagres de som `1`, `2`, `3` … opp til *N*, med den filendelsen de får.",
          )
          replace_once(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              "Briefen er **generert**, ikke skrevet. Den er én sammenhengende tekst brukeren limer rett inn der bildene lages, og formatet er dette:",
              "Briefen er **generert**, ikke skrevet. Den er én sammenhengende tekst som vertsklienten kan sende direkte til bildegenereringen, eller som kan kopieres til stedet bildene lages når direkte overlevering ikke finnes. Formatet er dette:",
          )
          text = Path('docs/AGENT_PRESENTATION_DESIGN.md').read_text()
          text = text.replace('- å droppe relevante bilder fordi agenten mangler rastergenerator;', '- å behandle bildeplan og bildebrief som en fallback fordi rasterfilen produseres utenfor Slaids;')
          Path('docs/AGENT_PRESENTATION_DESIGN.md').write_text(text)

          # README: describe the same standard workflow, without making copying mandatory.
          replace_once(
              'README.md',
              "Siden Slaids ikke lager bilder, finnes det en arbeidsflyt for å bestille dem et\nannet sted og få dem inn igjen samlet.",
              "Slaids-agent-API-et genererer ikke rasterfiler. Standardflyten er at agenten\nreserverer bildesoner, skriver bildeplan og felles bildekontekst, og Slaids\ngenererer den samlede bildebriefen. En vertsklient som ChatGPT kan sende briefen\ndirekte til innebygd bildegenerering i samme samtale. Kopiering av briefen og\nbildedeponeringen er fortsatt en gyldig filoverføringsvei når direkte overlevering\nikke finnes.",
          )

          # Implementation plan: update current architecture statements, not historical mechanics.
          replace_once(
              'IMPLEMENTATION_PLAN.md',
              "Slaids genererer ikke bilder, og vanlig Slaids/MCP har ikke tilgang til en\ngenerativ bildemodell. Arbeidsflyten for genererte rasterbilder er derfor:\nagenten planlegger bildene, brukeren lager dem i en samtale med en assistent som\nhar bildeverktøy, og setter dem inn i sonene som allerede står klare.",
              "Slaids-agent-API-et genererer ikke rasterfiler; det er et bevisst skille mellom\npresentasjonsplanlegging og bildegenerering. Arbeidsflyten for rasterbilder er\nalltid den samme: agenten reserverer bildesonene, skriver bildeplan og felles\nbildekontekst, og Slaids genererer den samlede briefen. En vertsklient som\nChatGPT kan sende briefen direkte til sitt innebygde bildeverktøy i samme\nsamtale når brukeren har bedt om generering. Hvis direkte overlevering ikke\nfinnes, brukes den samme briefen der bildene produseres; det er ikke en fallback.",
          )
          replace_once(
              'IMPLEMENTATION_PLAN.md',
              "`composeImageBrief` setter sammen én tekst brukeren limer rett inn der bildene\nlages. Alt som kan telles eller måles er avledet:",
              "`composeImageBrief` setter sammen én tekst som vertsklienten kan sende direkte\ntil bildegenereringen, eller som kan kopieres dit når direkte overlevering ikke\nfinnes. Alt som kan telles eller måles er avledet:",
          )
          regex_once(
              'IMPLEMENTATION_PLAN.md',
              r"Briefen er bestillingen\. Deponeringen er returen: brukeren lager alle bildene et\nannet sted og legger dem inn samlet, og hver fil havner i sonen den ble bestilt\nfor\.",
              "Briefen er bestillingen. En vertsklient kan sende den direkte til bildegenerering; når filene er produsert, er deponeringen returen: brukeren legger bildene inn samlet, og hver fil havner i sonen den ble bestilt for.",
          )

          # Fold the separate handoff document into the existing canonical docs.
          Path('docs/IMAGE_GENERATION_HANDOFF.md').unlink(missing_ok=True)
          Path('docs/CODEX_FIX_PR80.md').unlink(missing_ok=True)
          Path('docs/CODEX_FIX_PR80_TRIGGER.txt').unlink(missing_ok=True)
          PY
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit repaired PR
        run: |
          rm -f .github/workflows/pr80-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix raster image workflow contract and docs"
          git push origin HEAD:docs/image-brief-default-workflow
