# Typesjekken, linten, enhetstestene og byggingen, på hver PR og på main.
#
# Dette er porten et bidrag skal gjennom. Den kjører nøyaktig de fire
# kommandoene `AGENTS.md` ber en bidragsyter kjøre lokalt, i den rekkefølgen —
# og den finnes fordi «jeg kjørte dem» ikke er noe et repo kan kontrollere.
# Vercel-sjekken som allerede står på hver PR er en *deploy*: den kjører
# `tsc --noEmit && vite build`, så den fanger typefeil og et bygg som brekker,
# og den kjører null tester.
#
# Rekkefølgen er billigst og mest presis først. En typefeil er ett navn på én
# linje; en testfeil er en påstand om oppførsel; et brudd i byggingen kan være
# begge deler sett gjennom bundleren. Fail-fast er med vilje: den første feilen
# er nesten alltid den som forklarer resten.
#
# `npm run build` begynner med den samme typesjekken. Her er den allerede
# kjørt som eget steg (som sier hva som er galt i stedet for å skjule det bak
# «bygget feilet»), så byggesteget kjører `npm run build:app`: resten av
# `npm run build`, uten typesjekken en gang til. Det byggesteget legger til
# utover typesjekken, er
# `scripts/check-agent-bundle.mjs`: den laster den ferdige agent-API-bundelen i
# Node og kontrollerer at den faktisk svarer, med verktøyene, previewrendereren
# og stilarket i seg. Det er den ene kontrollen som ser på det Vercel deployer
# og ikke på kildekoden.
#
# ## Det som ikke kjøres to ganger
#
# Et push til `main` er nesten alltid en PR som nettopp er slått sammen, og
# PR-kjøringen testet allerede nøyaktig den koden: GitHub tester PR-en flettet
# med `main`, og har ikke `main` flyttet seg siden, får den sammenslåtte
# commiten det samme Git-treet. En vellykket PR-kjøring legger derfor igjen en
# liten markør oppkalt etter treet den testet, og et push med samme tre viser
# til den i stedet for å teste alt på nytt. Har `main` flyttet seg, er treet
# nytt, og alt kjøres. Regelen og begrunnelsen står i `scripts/ci-plan.mjs`.
# Jobben kjører uansett og gir et svar, så den påkrevde sjekken er alltid der.
#
# ## Nettlesertestene står i en egen workflow
#
# `npm run e2e` starter en ekte Chromium og klikker seg gjennom appen — rundt 400
# kjøringer og 25 minutter. Det er for lenge til at hver PR skal vente på alt,
# så `.github/workflows/e2e.yml` kjører et utvalg (`@pr`) på hver PR og hele
# suiten hver natt. Hva som er med hvor, står i `docs/E2E_CI.md`.
name: Tester

on:
  pull_request:
  push:
    branches: [main]

# Ingenting her skriver til repoet. `actions: read` trengs for å slå opp om
# den samme koden allerede er testet (se over).
permissions:
  contents: read
  actions: read

# En ny push gjør den forrige kjøringen på samme gren uendelig uinteressant.
# `main` er unntaket: hver commit der er et svar noen kan komme til å slå opp
# senere, så de får stå.
concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Typesjekk, lint, enhetstester og bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Avgjør om de tunge stegene trengs. Skriptet har ingen avhengigheter og
      # kjører før installasjonen, så et push som allerede er testet, koster
      # sekunder. Er noe uklart, kjøres alt.
      - name: Er denne koden allerede testet?
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs tester

      - name: Installer avhengigheter
        if: steps.plan.outputs.kjor == 'true'
        uses: ./.github/actions/installer-avhengigheter

      - name: Typesjekk
        if: steps.plan.outputs.kjor == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.plan.outputs.kjor == 'true'
        run: npm run lint

      - name: Enhetstester
        if: steps.plan.outputs.kjor == 'true'
        run: npm test

      - name: Bygg
        if: steps.plan.outputs.kjor == 'true'
        run: npm run build:app

      # Markøren et push til `main` ser etter: navnet er Git-treet som nettopp
      # besto alt over. Treet til en PR-kjøring er flettecommiten med `main`,
      # som er det `main` får når PR-en slås sammen uten at `main` har flyttet
      # seg. Innholdet er bare til den som åpner den.
      - name: Merk koden som testet
        id: tree
        if: github.event_name == 'pull_request' && steps.plan.outputs.kjor == 'true'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Typesjekk, lint, enhetstester og bygg besto for treet $tree (commit $GITHUB_SHA)." > testet-tre.txt

      - if: steps.tree.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: testet-tre-${{ steps.tree.outputs.tree }}
          path: testet-tre.txt
          retention-days: 30
          overwrite: true
