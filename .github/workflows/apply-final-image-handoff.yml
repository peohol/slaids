name: Apply final image handoff fix

on:
  push:
    branches:
      - fix/final-image-handoff-after-qa

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-image-handoff-after-qa

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply Codex review fix
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'src/agent/design.ts',
              'Slaids-agent-API-et lager ikke rasterbilder; det er et bevisst arkitekturvalg, ikke en manglende funksjon som skal oppdages. Ikke undersøk om Slaids eller vertsklienten «har en bildegenerator» før du planlegger. Rasterflyten er alltid: reserver ekte bildesoner, skriv bildeplan og felles bildekontekst, og la Slaids generere den samlede bildebriefen. Dette er standardflyten, ikke en fallback eller nødløsning. Når brukerbestillingen forutsetter rasterbilder for å være oppfylt – også formuleringer som «med bilder», «bruk bilder» eller «bilder i hvert steg» – og vertsklienten har et separat, innebygd bildegenereringsverktøy, er neste handling etter en gyldig ferdig brief obligatorisk: skriv den returnerte briefen ut i samme samtale, og kall deretter umiddelbart vertsklientens bildegenereringsverktøy med briefen som bildegenereringsinstruks. At briefen finnes i verktøyresponsen er ikke en overlevering, og at briefen bare er skrevet ut i samtalen betyr ikke at genereringen er startet; genereringen er først startet når bildegenereringsverktøyet faktisk er kalt. Ikke avslutt oppgaven, kall presentasjonen ferdig eller la validering eller preview være siste steg før dette kallet er gjort. Hvis klienten ikke kan gjøre denne overleveringen direkte, er den samme briefen fortsatt normal leveranse til stedet rasterfilene produseres. Direkte overlevering av briefen automatiserer bare starten på bildegenereringen; uten en filbro tilbake til Slaids går de ferdige filene fortsatt via bildedeponeringen. Ikke bytt til en hjemmelaget erstatning eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.',
              'Slaids-agent-API-et lager ikke rasterbilder; det er et bevisst arkitekturvalg, ikke en manglende funksjon som skal oppdages. Ikke undersøk om Slaids eller vertsklienten «har en bildegenerator» før du planlegger. Rasterflyten er alltid: reserver ekte bildesoner, skriv bildeplan og felles bildekontekst, og la Slaids generere den samlede bildebriefen. Dette er standardflyten, ikke en fallback eller nødløsning. Når brukerbestillingen forutsetter rasterbilder for å være oppfylt – også formuleringer som «med bilder», «bruk bilder» eller «bilder i hvert steg» – og vertsklienten har et separat, innebygd bildegenereringsverktøy, skal selve genereringen vente til presentasjonstilstanden er endelig. En brief hentet mens det fortsatt gjenstår citations, innholdsendringer, validering eller reparasjoner, eller visuell QA som kan endre bildesoner, er foreløpig og skal ikke sendes til bildegeneratoren. Etter at disse stegene er ferdige og bildesonene er stabile, hent en fersk ferdig brief fra den endelige presentasjonstilstanden. Først da er neste handling obligatorisk: skriv den returnerte briefen ut i samme samtale, og kall deretter umiddelbart vertsklientens bildegenereringsverktøy med briefen som bildegenereringsinstruks. At briefen finnes i verktøyresponsen er ikke en overlevering, og at briefen bare er skrevet ut i samtalen betyr ikke at genereringen er startet; genereringen er først startet når bildegenereringsverktøyet faktisk er kalt. Ikke avslutt oppgaven eller kall presentasjonen ferdig før dette kallet er gjort. Ikke gjør endringer som påvirker bildeplanen etter handoff; hvis det likevel skjer, hent en ny fersk sluttbrief og start bildegenereringen på nytt. Hvis klienten ikke kan gjøre denne overleveringen direkte, er den samme sluttbriefen fortsatt normal leveranse til stedet rasterfilene produseres. Direkte overlevering av briefen automatiserer bare starten på bildegenereringen; uten en filbro tilbake til Slaids går de ferdige filene fortsatt via bildedeponeringen. Ikke bytt til en hjemmelaget erstatning eller et abstrakt diagram bare fordi rasterfilen produseres utenfor Slaids.'
          )

          replace_exact(
              'src/server/mcp/instructions.ts',
              '4. Før du lager den første visuelle filen, gjør ett samlet visuelt pass over hele dekket. Identifiser konkrete visuelle ankerpunkter og bestem medietype for hvert av dem ut fra pedagogisk rolle: raster når publikum trenger å se personen, stedet, bygget, gjenstanden, miljøet eller scenen; SVG når publikum trenger å se relasjonen, strukturen, sekvensen, målingen eller flyten. Deretter avgjør du hvilke soner som trenger visuelt innhold. Diagrammatisk figur blir SVG og fyller bare sin egen sone. Illustrasjon blir et rasterbilde: lag bildesonen først, slik at sonens format passer motivet, legg bildet inn i dekkets bildeplan og skriv felles bildekontekst. Når planen er ferdig, hent den genererte bildebriefen og følg rasterflytens obligatoriske vertsklient-handoff før du avslutter.\n5. Legg til kilder og citations via referansesystemet der faktapåstander trenger dem.\n6. Gjør én semantisk endring om gangen, med id-ene du nettopp leste.\n7. Inspiser eller valider på nytt. Ved overflow: rediger teksten først, komponer på nytt når problemet er strukturelt, og rett opp det som ble avvist.\n8. Kjør kontrollpunktene under før du leverer, og render representative slides visuelt – spesielt der du selv har laget en SVG.',
              '4. Før du lager den første visuelle filen, gjør ett samlet visuelt pass over hele dekket. Identifiser konkrete visuelle ankerpunkter og bestem medietype for hvert av dem ut fra pedagogisk rolle: raster når publikum trenger å se personen, stedet, bygget, gjenstanden, miljøet eller scenen; SVG når publikum trenger å se relasjonen, strukturen, sekvensen, målingen eller flyten. Deretter avgjør du hvilke soner som trenger visuelt innhold. Diagrammatisk figur blir SVG og fyller bare sin egen sone. Illustrasjon blir et rasterbilde: lag bildesonen først, slik at sonens format passer motivet, legg bildet inn i dekkets bildeplan og skriv felles bildekontekst. Når planen er ferdig, kontroller den, men ikke start ekstern rastergenerering ennå; resten av presentasjonsarbeidet kan fortsatt endre bildesonene.\n5. Legg til kilder og citations via referansesystemet der faktapåstander trenger dem.\n6. Gjør én semantisk endring om gangen, med id-ene du nettopp leste.\n7. Inspiser eller valider på nytt. Ved overflow: rediger teksten først, komponer på nytt når problemet er strukturelt, og rett opp det som ble avvist.\n8. Kjør kontrollpunktene under før du leverer, og render representative slides visuelt – spesielt der du selv har laget en SVG.\n9. Når alle innholdsendringer, citations, validering/reparasjoner og visuell QA er ferdige og bildesonene er stabile, hent den genererte bildebriefen på nytt fra den endelige presentasjonstilstanden. Krever rasterflyten direkte vertsklient-handoff, skriv denne ferske briefen ut i samme samtale og start bildegenereringen umiddelbart. Ikke endre bildeplanen etterpå; skjer det likevel, gjenta sluttbrief og handoff.'
          )

          replace_exact(
              'docs/AGENT_PRESENTATION_DESIGN.md',
              'Når Slaids brukes fra en vertsklient som ChatGPT, og brukerbestillingen forutsetter rasterbilder for å være oppfylt – også formuleringer som «med bilder», «bruk bilder» eller «bilder i hvert steg» – skal klienten, dersom den har et innebygd bildegenereringsverktøy, gjøre overleveringen med en gang Slaids har returnert en gyldig ferdig brief: skriv den returnerte briefen ut i samme samtale og kall deretter umiddelbart bildegenereringsverktøyet med briefen som instruks. Det er ikke nok at briefen ligger i verktøyresponsen, og det er ikke nok at den bare er skrevet i samtalen; genereringen er først startet når bildegenereringsverktøyet faktisk er kalt. Agenten skal ikke avslutte oppgaven, kalle presentasjonen ferdig eller la validering/preview være siste steg før dette kallet er gjort. Hvis klienten ikke kan gjøre denne overleveringen direkte, brukes nøyaktig den samme briefen der bildene produseres; det er fortsatt normal arbeidsflyt, ikke en fallback. Direkte overlevering av briefen automatiserer bare starten på genereringen; uten en filbro tilbake til Slaids går de ferdige bildefilene fortsatt via bildedeponeringen nedenfor.',
              'Når Slaids brukes fra en vertsklient som ChatGPT, og brukerbestillingen forutsetter rasterbilder for å være oppfylt – også formuleringer som «med bilder», «bruk bilder» eller «bilder i hvert steg» – skal rastergenereringen skje fra en sluttbrief, ikke fra den første gyldige briefen under planleggingen. Fullfør først citations, øvrige innholdsendringer, validering og reparasjoner og den visuelle QA-en som kan endre bildesonene. Når bildesonene deretter er stabile, hent den genererte briefen på nytt fra den endelige presentasjonstilstanden. Dersom klienten har et innebygd bildegenereringsverktøy, skal den da gjøre overleveringen umiddelbart: skriv den ferske sluttbriefen ut i samme samtale og kall bildegenereringsverktøyet med briefen som instruks. Det er ikke nok at briefen ligger i verktøyresponsen, og det er ikke nok at den bare er skrevet i samtalen; genereringen er først startet når bildegenereringsverktøyet faktisk er kalt. Agenten skal ikke avslutte oppgaven eller kalle presentasjonen ferdig før dette kallet er gjort. Hvis bildeplanen endres etter handoff, må en ny sluttbrief hentes og bildegenereringen startes på nytt. Hvis klienten ikke kan gjøre overleveringen direkte, brukes nøyaktig den samme sluttbriefen der bildene produseres; det er fortsatt normal arbeidsflyt, ikke en fallback. Direkte overlevering automatiserer bare starten på genereringen; uten en filbro tilbake til Slaids går de ferdige bildefilene fortsatt via bildedeponeringen nedenfor.'
          )

          replace_exact(
              'IMPLEMENTATION_PLAN.md',
              'Slaids-agent-API-et genererer ikke rasterfiler; det er et bevisst skille mellom\npresentasjonsplanlegging og bildegenerering. Arbeidsflyten for rasterbilder er\nalltid den samme: agenten reserverer bildesonene, skriver bildeplan og felles\nbildekontekst, og Slaids genererer den samlede briefen. Når brukerbestillingen\nforutsetter rasterbilder for å være oppfylt — også formuleringer som «med\nbilder», «bruk bilder» eller «bilder i hvert steg» — og vertsklienten har et\ninnebygd bildegenereringsverktøy, skal klienten skrive den returnerte briefen ut\ni samme samtale og umiddelbart starte bildegenereringen med den. Verken en brief\nsom bare finnes i verktøyresponsen eller en brief som bare er skrevet ut, er en\nfullført handoff; genereringen er først startet når bildegenereringsverktøyet\nfaktisk er kalt, og oppgaven skal ikke avsluttes før det har skjedd. Hvis direkte\noverlevering ikke finnes, brukes den samme briefen der bildene produseres; det er\nikke en fallback. Denne direkte overleveringen gjelder briefen og starten på\ngenereringen, ikke filreturen: uten en filbro tilbake til Slaids går de ferdige\nbildefilene fortsatt gjennom bildedeponeringen i 7.3.',
              'Slaids-agent-API-et genererer ikke rasterfiler; det er et bevisst skille mellom\npresentasjonsplanlegging og bildegenerering. Arbeidsflyten for rasterbilder er\nalltid den samme: agenten reserverer bildesonene, skriver bildeplan og felles\nbildekontekst, og Slaids genererer den samlede briefen. Når brukerbestillingen\nforutsetter rasterbilder for å være oppfylt — også formuleringer som «med\nbilder», «bruk bilder» eller «bilder i hvert steg» — skal bildegenereringen\nstartes fra en fersk sluttbrief etter at citations, øvrige innholdsendringer,\nvalidering/reparasjoner og visuell QA som kan endre bildesonene er ferdige. En\nbrief hentet tidligere i arbeidsflyten er foreløpig og skal ikke sendes til\ngeneratoren. Når bildesonene er stabile, henter klienten briefen på nytt fra den\nendelige presentasjonstilstanden. Har vertsklienten innebygd bildegenerering,\nskal den skrive denne sluttbriefen ut i samme samtale og umiddelbart starte\nbildegenereringen med den. Verken en brief som bare finnes i verktøyresponsen\neller en brief som bare er skrevet ut, er en fullført handoff; genereringen er\nførst startet når bildegenereringsverktøyet faktisk er kalt, og oppgaven skal\nikke avsluttes før det har skjedd. Endres bildeplanen etterpå, må sluttbriefen\nhentes på nytt og genereringen gjentas. Hvis direkte overlevering ikke finnes,\nbrukes den samme sluttbriefen der bildene produseres; det er ikke en fallback.\nDenne direkte overleveringen gjelder briefen og starten på genereringen, ikke\nfilreturen: uten en filbro tilbake til Slaids går de ferdige bildefilene fortsatt\ngjennom bildedeponeringen i 7.3.'
          )

          replace_exact(
              'README.md',
              'Slaids-agent-API-et genererer ikke rasterfiler. Standardflyten er at agenten\nreserverer bildesoner, skriver bildeplan og felles bildekontekst, og Slaids\ngenererer den samlede bildebriefen. Når brukerbestillingen forutsetter\nrasterbilder og vertsklienten har innebygd bildegenerering, skal klienten skrive\nden returnerte briefen ut i samme samtale og starte bildegenereringen umiddelbart;\nverktøyresponsen alene er ikke handoff. Hvis klienten ikke kan sende briefen\ndirekte, kan den fortsatt kopieres manuelt. Uten en egen filbro tilbake til\nSlaids går de ferdige bildefilene fortsatt via bildedeponeringen.',
              'Slaids-agent-API-et genererer ikke rasterfiler. Standardflyten er at agenten\nreserverer bildesoner, skriver bildeplan og felles bildekontekst, og Slaids\ngenererer den samlede bildebriefen. Når brukerbestillingen forutsetter\nrasterbilder, skal den endelige bildegenereringen vente til presentasjonen er\nferdig validert og bildesonene er stabile; klienten henter da en fersk sluttbrief\nfra den endelige presentasjonstilstanden. Har vertsklienten innebygd\nbildegenerering, skal den skrive sluttbriefen ut i samme samtale og starte\nbildegenereringen umiddelbart; verktøyresponsen alene er ikke handoff. Hvis\nklienten ikke kan sende briefen direkte, kan den fortsatt kopieres manuelt. Uten\nen egen filbro tilbake til Slaids går de ferdige bildefilene fortsatt via\nbildedeponeringen.'
          )

          replace_exact(
              'src/server/mcp/visualPlanningInstructions.test.ts',
              "  it('treats raster planning as fixed and makes host generation an observable next action', () => {\n    expect(MCP_INSTRUCTIONS).toMatch(/Rasterflyten er fast, ikke en fallback/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/med bilder.*bruk bilder.*bilder i hvert steg/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/skriv den returnerte briefen ut i samme samtale/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/kall deretter umiddelbart.*bildegenereringsverktøyet/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/briefen finnes i verktøyresponsen er ikke en overlevering/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/først startet når bildegenereringsverktøyet faktisk er kalt/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/ikke avslutt oppgaven.*presentasjonen ferdig.*validering eller preview/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/filbro.*bildedeponeringen/i)\n    expect(MCP_INSTRUCTIONS).not.toMatch(/Mangler du en rastergenerator|har du ingen[^.]*bildegenerator/i)\n  })",
              "  it('waits for final QA, then makes host generation an observable next action', () => {\n    expect(MCP_INSTRUCTIONS).toMatch(/Rasterflyten er fast, ikke en fallback/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/med bilder.*bruk bilder.*bilder i hvert steg/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/ikke start ekstern rastergenerering ennå/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/innholdsendringer, citations, validering\/reparasjoner og visuell QA.*bildesonene er stabile/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/hent den genererte bildebriefen på nytt fra den endelige presentasjonstilstanden/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/skriv den returnerte briefen ut i samme samtale/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/kall deretter umiddelbart.*bildegenereringsverktøyet/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/briefen finnes i verktøyresponsen er ikke en overlevering/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/først startet når bildegenereringsverktøyet faktisk er kalt/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/bildeplanen etter handoff.*ny fersk sluttbrief.*på nytt/i)\n    expect(MCP_INSTRUCTIONS).toMatch(/filbro.*bildedeponeringen/i)\n    expect(MCP_INSTRUCTIONS).not.toMatch(/Mangler du en rastergenerator|har du ingen[^.]*bildegenerator/i)\n  })"
          )

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-image-handoff.yml
          git add src/agent/design.ts src/server/mcp/instructions.ts src/server/mcp/visualPlanningInstructions.test.ts docs/AGENT_PRESENTATION_DESIGN.md IMPLEMENTATION_PLAN.md README.md
          git diff --cached --check
          git commit -m "fix: hand off final image brief after QA"
          git push origin HEAD:fix/final-image-handoff-after-qa
