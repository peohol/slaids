name: Finalize PR 80 repair

on:
  push:
    branches:
      - docs/image-brief-default-workflow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/image-brief-default-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed repair
        run: |
          git show d852214653f0afdab8555ce92d2ad7d0a0b48a50:.github/workflows/pr80-repair.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/pr80-repair.py
          python /tmp/pr80-repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/mcp/instructions.test.ts')
          text = p.read_text()
          old = "    expect(IMAGE_USAGE_RULE).toMatch(/skal du ikke droppe relevante bilder/i)"
          new = "    expect(IMAGE_USAGE_RULE).toMatch(/Relevante rasterbilder skal planlegges/i)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old IMAGE_USAGE assertion, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify changed MCP contract
        run: npx vitest run src/server/mcp/instructions.test.ts src/server/mcp/visualPlanningInstructions.test.ts
      - name: Recheck unrelated fit-parity failure alone
        run: npx vitest run src/render/fitParity.test.ts
      - name: Run full test suite serially
        run: npm test -- --maxWorkers=1
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit repaired PR
        run: |
          rm -f .github/workflows/pr80-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix raster image workflow contract and docs"
          git push origin HEAD:docs/image-brief-default-workflow
