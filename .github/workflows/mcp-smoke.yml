# The MCP endpoint, checked against a real deployment.
#
# Everything under `npm test` drives the handler in-process. Two things only
# exist once something is deployed: the platform's own routing, and the
# authentication boundary as a client meets it — which status a message gets,
# which headers come back, and whether a client with no token is handed a tool
# catalogue at all. That last one is what a ChatGPT tool scan sees, and it is
# what `scripts/mcp-smoke.mjs` checks.
#
# Run it by hand from the Actions tab. Without a token it runs the public half
# and the refusals, which needs no credential at all; with one it also runs a
# real operation and compares the public catalogue against the authenticated
# REST catalogue on the same deployment.
#
# Point it at production, or at any deployment a plain HTTP client can reach.
# Vercel Authentication is on for every deployment URL of this project except the
# custom domains, so a preview address answers the runner with a redirect to
# `vercel.com/sso-api` rather than with Slaids — a run against one of those is
# testing Vercel's front door, not this endpoint. To get past that door, paste a
# Vercel share link (Deployment → Share) into `share_url`: the run trades it for
# a bypass cookie and sends that alongside every request. The cookie is for the
# front door only; the checks below still send no `Authorization` of their own.
name: MCP smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Installasjonen, uten sti. F.eks. https://slaids.no'
        required: true
        default: 'https://slaids.no'
      token:
        description: 'Agenttoken for den autentiserte halvdelen. Tomt = bare den offentlige.'
        required: false
        default: ''
      expect_tools:
        description: 'Forventet antall verktøy. 0 = ikke sjekk antallet.'
        required: false
        default: '0'
      share_url:
        description: 'Vercel share-lenke, hvis adressen ligger bak Vercel Authentication.'
        required: false
        default: ''

# Nothing here reads or writes the repository beyond checking it out.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # A share link is a redirect that ends in a cookie, so the only way to hold
      # it is a cookie jar. Nothing here touches Slaids' own authentication: the
      # cookie gets the runner past Vercel's front door and stops there.
      #
      # `#HttpOnly_` is not a comment. curl marks an HttpOnly cookie by prefixing
      # its line that way in the Netscape jar format, and Vercel's bypass cookie
      # is HttpOnly — so a filter that drops every line starting with `#` drops
      # the one cookie this step exists to read, and reports "no cookie" for a
      # jar that has it.
      - name: Bytt inn share-lenken i en bypass-cookie
        if: inputs.share_url != ''
        env:
          SHARE_URL: ${{ inputs.share_url }}
        run: |
          curl -sS -L -c jar.txt -o /dev/null "$SHARE_URL"
          COOKIE=$(awk '
            /^#HttpOnly_/ { sub(/^#HttpOnly_/, "") }
            /^#/ { next }
            NF >= 7 { printf "%s%s=%s", sep, $6, $7; sep = "; " }
          ' jar.txt)
          rm -f jar.txt
          if [ -z "$COOKIE" ]; then echo "Fikk ingen cookie fra share-lenken."; exit 1; fi
          echo "::add-mask::$COOKIE"
          echo "SMOKE_COOKIE=$COOKIE" >> "$GITHUB_ENV"

      # No install: the script has no dependencies, on purpose. What it checks
      # is HTTP, and a client that needed a package tree would be checking
      # something else.
      - name: Smoke test
        env:
          SLAIDS_BASE_URL: ${{ inputs.base_url }}
          SLAIDS_TOKEN: ${{ inputs.token }}
          EXPECT_TOOLS: ${{ inputs.expect_tools }}
        run: |
          if [ -n "$SLAIDS_TOKEN" ]; then echo "::add-mask::$SLAIDS_TOKEN"; fi
          if [ -n "$SMOKE_COOKIE" ]; then set -- --header "Cookie: $SMOKE_COOKIE"; fi
          node scripts/mcp-smoke.mjs --expect-tools "$EXPECT_TOOLS" "$@"
